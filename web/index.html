<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sophclaw-agent</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
:root{--bg:#101418;--panel:#1a2027;--panel2:#222a33;--border:#2e3742;--text:#dbe2ea;--dim:#8a96a3;--accent:#4f9cf9;--green:#3fb96f;--red:#e5604c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
button.danger{background:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font:inherit;width:100%}
textarea{resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--dim);font-size:12px}
.hidden{display:none!important}
/* login */
#login{margin:auto;width:320px;background:var(--panel);padding:28px;border-radius:12px;border:1px solid var(--border)}
#login h1{font-size:20px;margin:0 0 16px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
/* app shell */
#app{display:flex;flex:1;min-height:0}
#sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar header{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
#sidebar header b{flex:1}
#sessions{flex:1;overflow-y:auto}
.sess{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.sess:hover,.sess.active{background:var(--panel2)}
.sess .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11px;color:var(--dim)}
#userbox{padding:10px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
#userbox b{flex:1;color:var(--text)}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
#tabs button{background:transparent;color:var(--dim);border-radius:6px}
#tabs button.on{background:var(--panel2);color:var(--text)}
/* chat */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.user .filechip{display:flex;width:fit-content;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 9px;margin:0 0 6px;font-size:13px}
.msg.user .filechip .fi{font-size:15px}
.msg.user .utext{white-space:pre-wrap;word-break:break-word}
/* 用户气泡下方的操作行（恢复 / 重新编辑 并排，右对齐） */
.msg-user-actions{align-self:flex-end;display:flex;gap:6px;margin-top:-6px}
.msg-user-actions button{font-size:12px;padding:2px 8px}
/* 流式期间隐藏历史操作按钮 */
body.streaming .msg-user-actions{display:none!important}
.msg.assistant{align-self:flex-start;background:var(--panel2);white-space:normal}
/* markdown inside assistant bubbles */
.msg.assistant p{margin:0 0 8px}.msg.assistant p:last-child{margin-bottom:0}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:10px 0 6px;line-height:1.3}
.msg.assistant h1{font-size:18px}.msg.assistant h2{font-size:16px}.msg.assistant h3,.msg.assistant h4{font-size:14px}
.msg.assistant ul,.msg.assistant ol{margin:4px 0 8px;padding-left:22px}
.msg.assistant li{margin:2px 0}
.msg.assistant code{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.msg.assistant pre.code{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
.msg.assistant pre.code code{background:none;border:0;padding:0;white-space:pre}
.msg.assistant blockquote{border-left:3px solid var(--accent);margin:6px 0;padding:2px 10px;color:var(--dim)}
.msg.assistant table{border-collapse:collapse;margin:6px 0;font-size:13px}
.msg.assistant th,.msg.assistant td{border:1px solid var(--border);padding:4px 10px;text-align:left}
.msg.assistant th{background:var(--panel);color:var(--text)}
.msg.assistant a{color:var(--accent)}
.msg.assistant hr{border:0;border-top:1px solid var(--border);margin:8px 0}
/* 数学公式：行内默认；display 数学独立成块并居中（KaTeX 渲染 .math span） */
.math[data-display="1"]{display:block;margin:8px 0;text-align:center;overflow-x:auto}
.msg.err{align-self:center;background:transparent;color:var(--red);font-size:13px}
/* worklog: 整轮活动折叠组（思考 + 工具合并） */
details.worklog{align-self:flex-start;max-width:78%;margin:0}
details.worklog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 6px;margin-left:-6px;border-radius:7px;color:var(--dim);font-size:12.5px;font-style:italic}
details.worklog>summary::-webkit-details-marker{display:none}
details.worklog>summary:hover{background:var(--panel)}
.wl-caret{display:inline-block;transition:transform .15s;font-style:normal;font-size:10px;color:var(--dim)}
details.worklog[open]>summary .wl-caret{transform:rotate(90deg)}
.wl-body{margin:6px 0 0 6px;padding-left:10px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
/* worklog 内：思考卡 */
.thinking-card{font-size:12.5px;color:var(--dim)}
.thinking-card .tc-label{font-style:italic;opacity:.8}
.thinking-card .think-body{margin-top:4px;white-space:normal;max-height:300px;overflow:auto;opacity:.9}
.thinking-card .think-body p{margin:0 0 6px}.thinking-card .think-body p:last-child{margin-bottom:0}
.thinking-card .think-body code{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.thinking-card .think-body pre.code{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
/* worklog 内：工具行（可逐个展开看明细） */
details.tool-card-row{font-size:12px;color:var(--dim)}
details.tool-card-row>summary{list-style:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tool-card-row>summary::-webkit-details-marker{display:none}
details.tool-card-row>summary:hover{color:var(--text)}
details.tool-card-row pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;max-height:240px;overflow:auto}
details.tool-card-row.err>summary{color:var(--red)}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);flex-direction:column;align-items:stretch}
#composer textarea{flex:1;height:60px}
#empty{margin:auto;text-align:center;color:var(--dim)}
/* file management (REQ2.1/2.2) */
#chat{flex-direction:row}
#chatmain{flex:1;display:flex;flex-direction:column;min-width:0}
#filetree{width:280px;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow-y:auto}
#filetree header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#filetree header b{flex:1}
#filetree .body{padding:6px 8px;overflow-y:auto}
.tnode{padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tnode:hover{background:var(--panel2)}
.tnode .sz{color:var(--dim);font-size:11px;margin-left:6px}
.tchildren{margin-left:14px;border-left:1px solid var(--border);padding-left:4px}
.iconbtn{background:transparent;color:var(--dim);border:1px solid var(--border);padding:6px 9px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
#chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:12px;color:var(--text)}
.chip b{font-weight:500}.chip .x{cursor:pointer;color:var(--dim)}
/* admin / agents / groups panels */
#admin,#agents,#groups{flex:1;overflow-y:auto;padding:20px;max-width:880px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;background:var(--panel2);color:var(--dim)}
.pill.owner{background:#2c4a2f;color:#9fe0b0}.pill.manager{background:#3a3a22;color:#e0d79f}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--dim);font-weight:500}
td .row-actions{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.muted{color:var(--dim);font-size:12px}
.tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
</style>
</head>
<body>

<div id="login">
  <h1>sophclaw-agent</h1>
  <label>Username</label><input id="li-user" autocomplete="username">
  <label>Password</label><input id="li-pass" type="password" autocomplete="current-password">
  <div class="err" id="li-err"></div>
  <button style="width:100%" onclick="doLogin()">Sign in</button>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <header><b>Sessions</b><button onclick="newSessionDialog()">+ New</button></header>
    <div id="sessions"></div>
    <div id="userbox"><b id="whoami"></b><button class="ghost" onclick="logout()">Logout</button></div>
  </div>
  <div id="main">
    <div id="tabs">
      <button id="tab-chat" class="on" onclick="showTab('chat')">Chat</button>
      <button id="tab-agents" onclick="showTab('agents')">Agents</button>
      <button id="tab-groups" onclick="showTab('groups')">Groups</button>
      <button id="tab-admin" class="hidden" onclick="showTab('admin')">Admin</button>
    </div>
    <div id="chat">
      <div id="chatmain">
        <div id="msgs"><div id="empty">Select or create a session to start.</div></div>
        <div id="composer" class="hidden">
          <div id="chips"></div>
          <div id="composerrow" style="display:flex;gap:8px">
            <input type="file" id="fileinput" class="hidden" onchange="onFileChosen(event)">
            <button id="attach" class="iconbtn" title="" onclick="$('fileinput').click()">📎</button>
            <button id="togglefiles" class="iconbtn" title="Files" onclick="toggleFiles()">📁</button>
            <textarea id="input" placeholder="Message... (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="send" onclick="sendMsg()">Send</button>
            <button id="stop" class="danger hidden" onclick="stopTurn()">Stop</button>
          </div>
        </div>
      </div>
      <div id="filetree" class="hidden">
        <header><b>Files</b><button class="iconbtn" title="Refresh" onclick="loadTree()">⟳</button></header>
        <div class="body" id="treebody"></div>
      </div>
    </div>
    <div id="agents" class="hidden"></div>
    <div id="groups" class="hidden"></div>
    <div id="admin" class="hidden"></div>
  </div>
</div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="markdown.js"></script>
<script src="worklog.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let token = localStorage.getItem("token") || "";
let me = null, sessions = [], agents = [], currentSid = null, streaming = false;
let editing = null;           // {mid} when re-editing the latest user message; cleared on send
let lastUserMid = null, lastUserText = "";   // latest user message id+text (for re-edit)

async function api(path, opts = {}) {
  opts.headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { logout(); throw new Error("unauthorized"); }
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp;
}
const apiJson = async (path, opts) => (await api(path, opts)).json();

// ---- auth -----------------------------------------------------------------
async function doLogin() {
  $("li-err").textContent = "";
  try {
    const data = await apiJson("/api/auth/login", {method: "POST",
      body: {username: $("li-user").value.trim(), password: $("li-pass").value}});
    token = data.token; localStorage.setItem("token", token);
    await boot();
  } catch (e) { $("li-err").textContent = e.message; }
}
$("li-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function logout() {
  token = ""; localStorage.removeItem("token"); me = null;
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
}

async function boot() {
  try { me = await apiJson("/api/auth/me"); } catch (e) { return; }
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("whoami").textContent = `${me.username}${me.is_admin ? " (admin)" : ""}`;
  $("tab-admin").classList.toggle("hidden", !me.is_admin);
  agents = await apiJson("/api/agents");
  await loadSessions();
}

// ---- sessions -------------------------------------------------------------
async function loadSessions() {
  sessions = await apiJson("/api/sessions");
  const box = $("sessions"); box.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "sess" + (s.id === currentSid ? " active" : "");
    div.innerHTML = `<div class="t"></div><div class="m"></div>`;
    div.querySelector(".t").textContent = s.title || "(new session)";
    div.querySelector(".m").textContent = `${s.agent_name} · ${s.updated_at.slice(0, 16)}`;
    div.onclick = () => openSession(s.id);
    box.appendChild(div);
  }
}

async function newSessionDialog() {
  agents = await apiJson("/api/agents");
  if (!agents.length) { alert("No agents available — create one in the Agents tab (you can in any group you own)."); return; }
  let choice = agents[0];
  if (agents.length > 1) {
    const name = prompt("Agent to use:\n" + agents.map(a => `- ${a.name}: ${a.description || a.model}`).join("\n"), agents[0].name);
    if (name === null) return;
    choice = agents.find(a => a.name === name.trim());
    if (!choice) { alert("unknown agent"); return; }
  }
  const s = await apiJson("/api/sessions", {method: "POST", body: {agent_id: choice.id}});
  await loadSessions();
  openSession(s.id);
}

async function openSession(sid) {
  currentSid = sid; showTab("chat");
  editing = null;
  lastUserMid = null; lastUserText = "";
  $("composer").classList.remove("hidden");
  const detail = await apiJson("/api/sessions/" + sid);
  currentAgent = agents.find(a => a.id === detail.agent_id) || null;
  updateAttachHint();
  attached = []; renderChips();
  const msgs = $("msgs"); msgs.innerHTML = "";
  for (const m of detail.messages) {
    if (m.role === "user" && !m.content.startsWith("[Earlier conversation summary]")) {
      addBubble("user", m.content, m.id);
      lastUserMid = m.id; lastUserText = m.content;
    }
    else if (m.role === "assistant") {
      const tcs = m.tool_calls || [];
      if (m.reasoning || tcs.length) {            // history: collapsed worklog
        const wl = ensureWorklog(); delete wl.dataset.live;
        if (m.reasoning) {
          const body = worklogThinkingCard(wl).querySelector(".think-body");
          body.dataset.raw = m.reasoning; body.innerHTML = mdToHtml(m.reasoning); renderMathInElement(body);
        }
        for (const tc of tcs) appendToolRow(wl, tc.name, JSON.stringify(tc.arguments, null, 2), null, true);
        wl.open = false; syncWorklogSummary(wl);
      }
      if (m.content) addBubble("assistant", m.content);
    }
  }
  // 最新用户气泡的操作行追加「重新编辑」（与「恢复」并排）
  if (lastUserMid) {
    const ar = document.querySelector(`.msg-user-actions[data-mid="${lastUserMid}"]`);
    if (ar) ar.appendChild(makeReeditBtn());
  }
  await loadSessions();
  msgs.scrollTop = msgs.scrollHeight;
}

// ---- markdown 渲染 + LaTeX 数学见 markdown.js（escapeHtml/mdToHtml/renderMathInElement）----

function makeRestoreBtn(mid) {
  const b = document.createElement("button");
  b.className = "ghost"; b.textContent = "↩ 恢复";
  b.onclick = () => restoreFrom(mid);
  return b;
}
function makeReeditBtn() {
  const b = document.createElement("button");
  b.className = "ghost"; b.textContent = "✎ 重新编辑";
  b.onclick = startReedit;
  return b;
}
function addBubble(cls, text, mid) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "assistant") { d.dataset.raw = text; d.innerHTML = mdToHtml(text); renderMathInElement(d); }
  else if (cls === "user") renderUserContent(d, text);
  else d.textContent = text;
  $("msgs").appendChild(d);
  // 用户气泡下方挂一行操作按钮（恢复；最新用户气泡还会追加「重新编辑」）
  if (cls === "user" && mid != null) {
    d.dataset.mid = mid;
    const actions = document.createElement("div");
    actions.className = "msg-user-actions";
    actions.dataset.mid = mid;
    actions.appendChild(makeRestoreBtn(mid));
    $("msgs").appendChild(actions);
  }
  return d;
}
// 用户气泡：把 [附加文件: path] 引用行渲染成文件小图标 + 文件名，正文照常显示
function renderUserContent(d, text) {
  const atts = [], rest = [];
  for (const ln of text.split("\n")) {
    const m = ln.match(/^\[附加文件: (.+)\]$/);
    if (m) atts.push(m[1]); else rest.push(ln);
  }
  for (const path of atts) {
    const chip = document.createElement("div");
    chip.className = "filechip";
    chip.innerHTML = `<span class="fi">📄</span><span class="fn"></span>`;
    chip.querySelector(".fn").textContent = path.split("/").pop();
    d.appendChild(chip);
  }
  const body = rest.join("\n").replace(/^\n+/, "");
  if (body.trim()) {
    const p = document.createElement("div");
    p.className = "utext"; p.textContent = body;
    d.appendChild(p);
  }
}
// ---- worklog: 整轮活动折叠组（思考 + 工具合并为一行摘要，可展开看明细）-------
function ensureWorklog() {
  const d = document.createElement("details");
  d.className = "worklog"; d.open = true; d.dataset.live = "1";   // 流式时展开
  const s = document.createElement("summary"); s.className = "wl-head";
  s.innerHTML = `<span class="wl-caret">▸</span><span class="wl-sum"></span>`;
  const body = document.createElement("div"); body.className = "wl-body";
  d.append(s, body); $("msgs").appendChild(d); return d;
}
function worklogThinkingCard(wl) {
  let card = wl.querySelector(".thinking-card");
  if (!card) {
    card = document.createElement("div"); card.className = "thinking-card";
    card.innerHTML = `<div class="tc-label">💡 思考</div><div class="think-body"></div>`;
    card.querySelector(".think-body").dataset.raw = "";
    wl.querySelector(".wl-body").prepend(card);     // 思考置于工具之前
  }
  return card;
}
function appendToolRow(wl, name, args, id, done) {
  const d = document.createElement("details");
  d.className = "tool-card-row";
  d.dataset.toolKind = toolKind(name);
  d.dataset.toolDone = done ? "true" : "false";
  if (id != null) d.dataset.id = id;
  const first = String(args || "").split("\n")[0].slice(0, 80);
  const s = document.createElement("summary");
  s.textContent = "🔧 " + name + (first ? " · " + first : "");
  const pre = document.createElement("pre"); pre.textContent = args || "";
  d.append(s, pre); wl.querySelector(".wl-body").appendChild(d); return d;
}
function setToolResult(row, preview) {
  if (row) row.querySelector("pre").textContent += "\n→ " + preview;
}
function setToolDone(row, isError) {
  if (!row) return;
  row.dataset.toolDone = "true";
  if (isError) { row.dataset.toolError = "true"; row.classList.add("err"); }
}
function syncWorklogSummary(wl) {
  if (!wl) return;
  const hasThinking = !!wl.querySelector(".thinking-card");
  const tools = [...wl.querySelectorAll(".tool-card-row")].map(r => ({
    kind: r.dataset.toolKind,
    done: r.dataset.toolDone !== "false",
    error: r.dataset.toolError === "true",
  }));
  const live = wl.dataset.live === "1";
  wl.querySelector(".wl-sum").textContent = worklogSummary({hasThinking, live, tools});
}
function closeWorklog(wl) {
  if (!wl) return;
  delete wl.dataset.live; wl.open = false; syncWorklogSummary(wl);
}

// ---- chat streaming ---------------------------------------------------------
async function sendMsg() {
  const text = $("input").value.trim();
  if ((!text && !attached.length) || !currentSid || streaming) return;
  const refs = attached.map(a => `[附加文件: ${a.path}]`).join("\n");
  const content = refs ? (refs + (text ? "\n\n" + text : "")) : text;
  attached = []; renderChips();
  $("input").value = ""; streaming = true;
  document.body.classList.add("streaming");
  $("send").classList.add("hidden"); $("stop").classList.remove("hidden");

  // 重新编辑：发送时才删除原用户消息及其回答，再以编辑后文本作为新轮发送
  if (editing) {
    try {
      await api(`/api/sessions/${currentSid}/truncate`, {method: "POST", body: {message_id: editing.mid}});
    } catch (e) {
      document.body.classList.remove("streaming");
      streaming = false;
      $("send").classList.remove("hidden"); $("stop").classList.add("hidden");
      alert("重新编辑失败: " + e.message);
      return;
    }
    editing = null;
    await openSession(currentSid);                 // re-render truncated history
    document.body.classList.add("streaming");      // openSession 不动此 class，保持流式态
  }

  addBubble("user", content);
  let bubble = null, wl = null, errored = false;
  const msgs = $("msgs");
  try {
    const resp = await api(`/api/sessions/${currentSid}/chat`, {method: "POST", body: {content}});
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "reasoning_delta") {
          if (bubble) continue;                  // answer started: lock out late reasoning
          if (!wl) wl = ensureWorklog();
          const body = worklogThinkingCard(wl).querySelector(".think-body");
          body.dataset.raw += ev.text;
          body.innerHTML = mdToHtml(body.dataset.raw);
          renderMathInElement(body);
          syncWorklogSummary(wl);
        } else if (ev.type === "text_delta") {
          if (!bubble) { if (wl) { closeWorklog(wl); wl = null; } bubble = addBubble("assistant", ""); }
          bubble.dataset.raw += ev.text;
          bubble.innerHTML = mdToHtml(bubble.dataset.raw);
          renderMathInElement(bubble);
        } else if (ev.type === "tool_call") {
          bubble = null;                          // 正文后再来工具 -> 新开活动组
          if (!wl) wl = ensureWorklog();
          appendToolRow(wl, ev.name, JSON.stringify(ev.arguments, null, 2), ev.id, false);
          syncWorklogSummary(wl);
        } else if (ev.type === "tool_result") {
          const rows = msgs.querySelectorAll("details.tool-card-row");
          const row = [...rows].find(r => r.dataset.id === ev.id) || rows[rows.length - 1];
          setToolResult(row, ev.preview); setToolDone(row, false);
          syncWorklogSummary(row ? row.closest(".worklog") : wl);
        } else if (ev.type === "error") {
          if (ev.message === "stopped by user") {  // 强行停止：不视为错误，finally 重渲染为干净状态
            if (wl) { closeWorklog(wl); wl = null; }
            bubble = null;
          } else {
            if (wl) { closeWorklog(wl); wl = null; }
            addBubble("err", ev.message); bubble = null; errored = true;
          }
        }
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
  } catch (e) {
    addBubble("err", e.message); errored = true;
  } finally {
    closeWorklog(wl);
    streaming = false;
    document.body.classList.remove("streaming");
    $("send").classList.remove("hidden"); $("stop").classList.add("hidden");
    if (errored) loadSessions();
    else await openSession(currentSid);   // 重渲染：补上恢复/重新编辑按钮与消息 id
  }
}

function toggleFiles() {
  const ft = $("filetree");
  ft.classList.toggle("hidden");
  if (!ft.classList.contains("hidden")) loadTree();
}
async function loadTree() {
  const body = $("treebody"); body.innerHTML = "";
  await renderInto(body, "");
}
async function renderInto(container, path) {
  let data;
  try { data = await apiJson("/api/files" + (path ? "?path=" + encodeURIComponent(path) : "")); }
  catch (e) { container.textContent = e.message; return; }
  if (!data.entries.length) { container.innerHTML = `<div class="muted">(empty)</div>`; return; }
  for (const e of data.entries) {
    const node = document.createElement("div");
    node.className = "tnode";
    node.textContent = (e.is_dir ? "▸ " : "   ") + e.name;
    if (!e.is_dir) { const s = document.createElement("span"); s.className = "sz"; s.textContent = e.size + "B"; node.appendChild(s); }
    container.appendChild(node);
    if (e.is_dir) {
      const kids = document.createElement("div");
      kids.className = "tchildren hidden"; container.appendChild(kids);
      node.onclick = async () => {
        kids.classList.toggle("hidden");
        const open = !kids.classList.contains("hidden");
        node.firstChild.textContent = (open ? "▾ " : "▸ ") + e.name;
        if (!kids.dataset.loaded) { kids.dataset.loaded = "1"; await renderInto(kids, e.path); }
      };
    } else {
      node.onclick = () => previewFile(e.path);
    }
  }
}
async function previewFile(path) {
  let data;
  try { data = await apiJson("/api/files/read?path=" + encodeURIComponent(path)); }
  catch (e) { alert(e.message); return; }
  if (data.content !== undefined) {
    if (confirm(`${data.name} (${data.size}B)\n\n` + data.content.slice(0, 2000) +
                (data.content.length > 2000 ? "\n..." : "") + "\n\n点「确定」下载该文件")) {
      downloadBlob(new Blob([data.content]), data.name);
    }
  } else {
    const a = document.createElement("a");
    a.href = data.data_url; a.download = data.name; a.click();
  }
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

let attached = [];           // [{name, path}]
let currentAgent = null;     // 当前会话的 agent（用于 read_file 提示）

function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
async function onFileChosen(ev) {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const dataUrl = await fileToDataUrl(file);
    const r = await apiJson("/api/files/upload", {method: "POST",
      body: {path: file.name, data_url: dataUrl}});
    attached.push({name: r.entry.name, path: r.entry.path});
    renderChips();
    if (!$("filetree").classList.contains("hidden")) loadTree();
  } catch (e) { alert("上传失败: " + e.message); }
}
function renderChips() {
  const box = $("chips"); box.innerHTML = "";
  attached.forEach((a, i) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.innerHTML = `📎 <b></b> <span class="x">✕</span>`;
    c.querySelector("b").textContent = a.path;
    c.querySelector(".x").onclick = () => { attached.splice(i, 1); renderChips(); };
    box.appendChild(c);
  });
}

function agentForm(parent, options, existing, groups) {
  const old = parent.querySelector(".agent-form"); if (old) old.remove();
  const f = document.createElement("div");
  f.className = "agent-form";
  f.style.cssText = "margin-top:12px;border-top:1px solid var(--border);padding-top:8px";
  f.innerHTML = `
    <div class="grid2">
      <div><label>Name</label><input id="af-name"></div>
      <div><label>Group</label><select id="af-group"></select></div>
      <div><label>Description</label><input id="af-desc"></div>
      <div><label>Provider</label><select id="af-provider"></select></div>
      <div><label>Model</label><input id="af-model" placeholder="e.g. gpt-4o, claude-sonnet-4-6"></div>
    </div>
    <label>System prompt</label><textarea id="af-prompt" rows="4"></textarea>
    <label>Tools</label><div id="af-tools"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="af-save"></button><button class="ghost" id="af-cancel">Cancel</button>
    </div>`;
  parent.appendChild(f);
  for (const g of (groups || [])) {
    const o = document.createElement("option"); o.value = g.id; o.textContent = g.name;
    $("af-group").appendChild(o);
  }
  if (existing) { $("af-group").value = existing.group_id; $("af-group").disabled = true; }
  for (const p of options.providers) {
    const o = document.createElement("option"); o.value = o.textContent = p;
    $("af-provider").appendChild(o);
  }
  for (const t of options.tools) {
    const id = "aft-" + t;
    const lbl = document.createElement("label");
    lbl.style.cssText = "display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;color:var(--text);font-size:13px";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = id; cb.value = t; cb.style.width = "auto";
    lbl.append(cb, document.createTextNode(t));
    $("af-tools").appendChild(lbl);
  }
  if (existing) {
    $("af-name").value = existing.name; $("af-desc").value = existing.description;
    $("af-provider").value = existing.provider; $("af-model").value = existing.model;
    $("af-prompt").value = existing.system_prompt;
    for (const t of existing.tools) { const cb = $("aft-" + t); if (cb) cb.checked = true; }
  }
  $("af-save").textContent = existing ? "Save changes" : "Create agent";
  $("af-cancel").onclick = () => f.remove();
  $("af-save").onclick = async () => {
    const body = {
      name: $("af-name").value.trim(), description: $("af-desc").value.trim(),
      provider: $("af-provider").value, model: $("af-model").value.trim(),
      system_prompt: $("af-prompt").value,
      tools: [...f.querySelectorAll("#af-tools input:checked")].map(c => c.value),
    };
    if (!existing && $("af-group").value) body.group_id = +$("af-group").value;
    try {
      if (existing) await apiJson(`/api/agents/${existing.id}`, {method: "PUT", body});
      else await apiJson("/api/agents", {method: "POST", body});
      renderAgents();
    } catch (e) { alert(e.message); }
  };
}

// small DOM helpers
function card(parent, title) {
  const c = document.createElement("div"); c.className = "card";
  const h = document.createElement("h3"); h.style.margin = "0 0 4px"; h.textContent = title;
  c.appendChild(h); parent.appendChild(c); return c;
}
function table(parent, headers) {
  const t = document.createElement("table");
  const tr = t.createTHead().insertRow();
  for (const h of headers) { const th = document.createElement("th"); th.textContent = h; tr.appendChild(th); }
  t.createTBody(); parent.appendChild(t); return t.tBodies[0];
}
function row(tbody, cells) {
  const tr = tbody.insertRow();
  for (const c of cells) tr.insertCell().textContent = c;
  return tr;
}
function btn(parent, label, cls, onclick) {
  const b = document.createElement("button");
  if (cls) b.className = cls;
  b.textContent = label; b.onclick = onclick;
  b.style.fontSize = "12px"; b.style.padding = "3px 8px";
  parent.appendChild(b); return b;
}
