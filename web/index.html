<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sophclaw-agent</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
:root{--bg:#101418;--panel:#1a2027;--panel2:#222a33;--border:#2e3742;--text:#dbe2ea;--dim:#8a96a3;--accent:#4f9cf9;--green:#3fb96f;--red:#e5604c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
button.danger{background:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font:inherit;width:100%}
textarea{resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--dim);font-size:12px}
.hidden{display:none!important}
/* login */
#login{margin:auto;width:320px;background:var(--panel);padding:28px;border-radius:12px;border:1px solid var(--border)}
#login h1{font-size:20px;margin:0 0 16px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
/* app shell */
#app{display:flex;flex:1;min-height:0}
#sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar header{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
#sidebar header b{flex:1}
#sessions{flex:1;overflow-y:auto}
.sess{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.sess:hover,.sess.active{background:var(--panel2)}
.sess .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11px;color:var(--dim)}
#userbox{padding:10px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
#userbox b{flex:1;color:var(--text)}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
#tabs button{background:transparent;color:var(--dim);border-radius:6px}
#tabs button.on{background:var(--panel2);color:var(--text)}
/* chat */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.user .filechip{display:flex;width:fit-content;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 9px;margin:0 0 6px;font-size:13px}
.msg.user .filechip .fi{font-size:15px}
.msg.user .utext{white-space:pre-wrap;word-break:break-word}
/* 用户气泡下方的操作行（恢复 / 重新编辑 并排，右对齐） */
.msg-user-actions{align-self:flex-end;display:flex;gap:6px;margin-top:-6px}
.msg-user-actions button{font-size:12px;padding:2px 8px}
/* 流式期间隐藏历史操作按钮 */
body.streaming .msg-user-actions{display:none!important}
.msg.assistant{align-self:flex-start;background:var(--panel2);white-space:normal}
/* markdown inside assistant bubbles */
.msg.assistant p{margin:0 0 8px}.msg.assistant p:last-child{margin-bottom:0}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:10px 0 6px;line-height:1.3}
.msg.assistant h1{font-size:18px}.msg.assistant h2{font-size:16px}.msg.assistant h3,.msg.assistant h4{font-size:14px}
.msg.assistant ul,.msg.assistant ol{margin:4px 0 8px;padding-left:22px}
.msg.assistant li{margin:2px 0}
.msg.assistant code{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.msg.assistant pre.code{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
.msg.assistant pre.code code{background:none;border:0;padding:0;white-space:pre}
.msg.assistant blockquote{border-left:3px solid var(--accent);margin:6px 0;padding:2px 10px;color:var(--dim)}
.msg.assistant table{border-collapse:collapse;margin:6px 0;font-size:13px}
.msg.assistant th,.msg.assistant td{border:1px solid var(--border);padding:4px 10px;text-align:left}
.msg.assistant th{background:var(--panel);color:var(--text)}
.msg.assistant a{color:var(--accent)}
.msg.assistant hr{border:0;border-top:1px solid var(--border);margin:8px 0}
/* 数学公式：行内默认；display 数学独立成块并居中（KaTeX 渲染 .math span） */
.math[data-display="1"]{display:block;margin:8px 0;text-align:center;overflow-x:auto}
.msg.err{align-self:center;background:transparent;color:var(--red);font-size:13px}
/* worklog: 整轮活动折叠组（思考 + 工具合并） */
details.worklog{align-self:flex-start;max-width:78%;margin:0}
details.worklog>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 6px;margin-left:-6px;border-radius:7px;color:var(--dim);font-size:12.5px;font-style:italic}
details.worklog>summary::-webkit-details-marker{display:none}
details.worklog>summary:hover{background:var(--panel)}
.wl-caret{display:inline-block;transition:transform .15s;font-style:normal;font-size:10px;color:var(--dim)}
details.worklog[open]>summary .wl-caret{transform:rotate(90deg)}
.wl-body{margin:6px 0 0 6px;padding-left:10px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
/* worklog 内：思考卡 */
.thinking-card{font-size:12.5px;color:var(--dim)}
.thinking-card .tc-label{font-style:italic;opacity:.8}
.thinking-card .think-body{margin-top:4px;white-space:normal;max-height:300px;overflow:auto;opacity:.9}
.thinking-card .think-body p{margin:0 0 6px}.thinking-card .think-body p:last-child{margin-bottom:0}
.thinking-card .think-body code{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.thinking-card .think-body pre.code{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
/* worklog 内：工具行（可逐个展开看明细） */
details.tool-card-row{font-size:12px;color:var(--dim)}
details.tool-card-row>summary{list-style:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tool-card-row>summary::-webkit-details-marker{display:none}
details.tool-card-row>summary:hover{color:var(--text)}
details.tool-card-row pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;max-height:240px;overflow:auto}
details.tool-card-row.err>summary{color:var(--red)}
.turnmeta{font-size:11px;color:var(--dim);align-self:flex-start;margin-top:-6px;opacity:.8}
.queued-info{font-size:12px;color:var(--dim);align-self:flex-start;margin-top:4px;padding:4px 10px;background:var(--panel2);border-radius:6px;border:1px dashed var(--border)}
#queue-status{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center;padding:4px 0;flex-wrap:wrap}
#composer{position:relative;display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);flex-direction:column;align-items:stretch}
#composer textarea{flex:1;height:60px}
#empty{margin:auto;text-align:center;color:var(--dim)}
/* file management (REQ2.1/2.2) */
#chat{flex-direction:row}
#chatmain{flex:1;display:flex;flex-direction:column;min-width:0}
#filetree{width:280px;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow-y:auto}
#filetree header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#filetree header b{flex:1}
#filetree .body{padding:6px 8px;overflow-y:auto}
.tnode{padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tnode:hover{background:var(--panel2)}
.tnode .sz{color:var(--dim);font-size:11px;margin-left:6px}
.tchildren{margin-left:14px;border-left:1px solid var(--border);padding-left:4px}
.iconbtn{background:transparent;color:var(--dim);border:1px solid var(--border);padding:6px 9px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
#chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:12px;color:var(--text)}
.chip b{font-weight:500}.chip .x{cursor:pointer;color:var(--dim)}
/* admin / agents / groups panels */
#admin,#agents,#groups{flex:1;overflow-y:auto;padding:20px;max-width:880px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;background:var(--panel2);color:var(--dim)}
.pill.owner{background:#2c4a2f;color:#9fe0b0}.pill.manager{background:#3a3a22;color:#e0d79f}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--dim);font-weight:500}
td .row-actions{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.muted{color:var(--dim);font-size:12px}
.tag{display:inline-block;background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
/* command palette — inspired by hermes-agent's slash command autocomplete */
#cmd-palette{position:absolute;bottom:100%;left:12px;right:12px;max-height:260px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 -4px 20px rgba(0,0,0,.5);z-index:100;display:none;margin-bottom:4px}
#cmd-palette .citem{padding:7px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border)}
#cmd-palette .citem:last-child{border-bottom:none}
#cmd-palette .citem:hover,#cmd-palette .citem.sel{background:var(--panel2)}
#cmd-palette .citem .cn{color:var(--accent);font-weight:bold;min-width:100px}
#cmd-palette .citem .cd{color:var(--dim);font-size:12px;flex:1}
#cmd-palette .citem .ch{color:var(--dim);font-size:11px;background:var(--panel2);border-radius:4px;padding:0 6px}
#composerrow{position:relative}
</style>
</head>
<body>

<div id="login">
  <h1>sophclaw-agent</h1>
  <label>Username</label><input id="li-user" autocomplete="username">
  <label>Password</label><input id="li-pass" type="password" autocomplete="current-password">
  <div class="err" id="li-err"></div>
  <button style="width:100%" onclick="doLogin()">Sign in</button>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <header><b>Sessions</b><button onclick="newSessionDialog()">+ New</button></header>
    <div id="sessions"></div>
    <div id="userbox"><b id="whoami"></b><button class="ghost" onclick="logout()">Logout</button></div>
  </div>
  <div id="main">
    <div id="tabs">
      <button id="tab-chat" class="on" onclick="showTab('chat')">Chat</button>
      <button id="tab-agents" onclick="showTab('agents')">Agents</button>
      <button id="tab-groups" onclick="showTab('groups')">Groups</button>
      <button id="tab-admin" class="hidden" onclick="showTab('admin')">Admin</button>
    </div>
    <div id="chat">
      <div id="chatmain">
        <div id="msgs"><div id="empty">Select or create a session to start.</div></div>
        <div id="composer" class="hidden">
          <div id="sesstools" style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);flex-wrap:wrap">
            <select id="st-provider" style="width:auto"></select>
            <input id="st-model" list="st-models" placeholder="model" style="width:160px">
            <datalist id="st-models"></datalist>
            <select id="st-think" style="width:auto">
              <option value="default">默认</option>
              <option value="thinking">思考</option>
              <option value="fast">快速</option>
            </select>
          </div>
          <div id="usagebar" style="font-size:11px;color:var(--dim);display:flex;gap:14px;padding:2px 0">
            <span id="ub-tok">↑0 ↓0</span>
            <span id="ub-ctx">ctx 0/0</span>
            <span id="ub-cache">cache —</span>
          </div>
          <div id="chips"></div>
          <div id="cmd-palette"><div id="cmd-palette-items"></div></div>
          <div id="queue-status" class="hidden" style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12px;color:var(--dim);border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap"></div>
          <div id="composerrow" style="display:flex;gap:8px">
            <input type="file" id="fileinput" class="hidden" onchange="onFileChosen(event)">
            <button id="attach" class="iconbtn" title="" onclick="$('fileinput').click()">📎</button>
            <button id="togglefiles" class="iconbtn" title="Files" onclick="toggleFiles()">📁</button>
            <textarea id="input" placeholder="Message... (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="send" onclick="sendMsg()">Send</button>
            <button id="stop" class="danger hidden" onclick="stopTurn()">Stop</button>
          </div>
        </div>
      </div>
      <div id="filetree" class="hidden">
        <header><b>Files</b><button class="iconbtn" title="Refresh" onclick="loadTree()">⟳</button></header>
        <div class="body" id="treebody"></div>
      </div>
    </div>
    <div id="agents" class="hidden"></div>
    <div id="groups" class="hidden"></div>
    <div id="admin" class="hidden"></div>
  </div>
</div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="markdown.js"></script>
<script src="worklog.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let token = localStorage.getItem("token") || "";
let me = null, sessions = [], agents = [], currentSid = null, streaming = false;
let editing = null;           // {mid} when re-editing the latest user message; cleared on send
let lastUserMid = null, lastUserText = "";   // latest user message id+text (for re-edit)
let queuedMessages = [];      // 排队消息列表 [{content, originalInput}]

async function api(path, opts = {}) {
  opts.headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (opts.body && typeof opts.body !== "string") opts.body = JSON.stringify(opts.body);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { logout(); throw new Error("unauthorized"); }
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp;
}
const apiJson = async (path, opts) => (await api(path, opts)).json();
async function expectJson(resp) {
  const contentType = resp.headers.get("content-type") || "";
  if (!contentType.includes("application/json")) {
    throw new Error(`Unexpected response type: ${contentType || "unknown"}`);
  }
  return resp.json();
}

// ---- auth -----------------------------------------------------------------
async function doLogin() {
  $("li-err").textContent = "";
  try {
    const data = await apiJson("/api/auth/login", {method: "POST",
      body: {username: $("li-user").value.trim(), password: $("li-pass").value}});
    token = data.token; localStorage.setItem("token", token);
    await boot();
  } catch (e) { $("li-err").textContent = e.message; }
}
$("li-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function logout() {
  token = ""; localStorage.removeItem("token"); me = null;
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
}

async function boot() {
  try { me = await apiJson("/api/auth/me"); } catch (e) { return; }
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("whoami").textContent = `${me.username}${me.is_admin ? " (admin)" : ""}`;
  $("tab-admin").classList.toggle("hidden", !me.is_admin);
  agents = await apiJson("/api/agents");
  await loadSessions();
  // 预加载命令列表供前端浮层使用
  _ensureCommands();
  // 启动 cron 轮询：后台定时任务完成后自动刷新当前会话
  startCronPoller();
}

// ---- sessions -------------------------------------------------------------
async function loadSessions() {
  sessions = await apiJson("/api/sessions");
  const box = $("sessions"); box.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "sess" + (s.id === currentSid ? " active" : "");
    div.innerHTML = `<div class="t"></div><div class="m"></div>`;
    div.querySelector(".t").textContent = s.title || "(new session)";
    div.querySelector(".m").textContent = `${s.agent_name} · ${s.updated_at.slice(0, 16)}`;
    div.onclick = () => openSession(s.id);
    box.appendChild(div);
  }
}

async function newSessionDialog() {
  agents = await apiJson("/api/agents");
  if (!agents.length) { alert("No agents available — create one in the Agents tab (you can in any group you own)."); return; }
  let choice = agents[0];
  if (agents.length > 1) {
    const name = prompt("Agent to use:\n" + agents.map(a => `- ${a.name}: ${a.description || a.model}`).join("\n"), agents[0].name);
    if (name === null) return;
    choice = agents.find(a => a.name === name.trim());
    if (!choice) { alert("unknown agent"); return; }
  }
  const s = await apiJson("/api/sessions", {method: "POST", body: {agent_id: choice.id}});
  await loadSessions();
  openSession(s.id);
}

async function openSession(sid) {
  currentSid = sid; showTab("chat");
  editing = null;
  lastUserMid = null; lastUserText = "";
  queuedMessages = []; renderQueueStatus();  // 切换 session 时清空排队
  $("composer").classList.remove("hidden");
  const detail = await apiJson("/api/sessions/" + sid);
  currentAgent = agents.find(a => a.id === detail.agent_id) || null;
  updateAttachHint();
  attached = []; renderChips();
  await setupSessTools(detail);
  $("ub-tok").textContent = "↑0 ↓0";
  $("ub-ctx").textContent = "ctx 0/0";
  $("ub-cache").textContent = "cache —";
  renderMessageList(detail);
  await loadSessions();
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

// ---- 消息渲染（openSession 与 cron 轮询刷新共用）--------------------------
let lastRenderedMsgCount = 0;   // 当前 session 已渲染的消息条数（用于检测后台新增）
function renderMessageList(detail) {
  const msgs = $("msgs");
  msgs.innerHTML = "";
  lastUserMid = null; lastUserText = "";
  for (const m of detail.messages) renderMessage(m);
  refreshReeditBtn();
  lastRenderedMsgCount = detail.messages.length;
}
function renderMessage(m) {
  if (m.role === "user" && !m.content.startsWith("[Earlier conversation summary]")) {
    addBubble("user", m.content, m.id);
    lastUserMid = m.id; lastUserText = m.content;
  }
  else if (m.role === "assistant") {
    const tcs = m.tool_calls || [];
    if (m.reasoning || tcs.length) {            // history: collapsed worklog
      const wl = ensureWorklog(); delete wl.dataset.live;
      if (m.reasoning) {
        const body = worklogThinkingCard(wl).querySelector(".think-body");
        body.dataset.raw = m.reasoning; body.innerHTML = mdToHtml(m.reasoning); renderMathInElement(body);
      }
      for (const tc of tcs) appendToolRow(wl, tc.name, JSON.stringify(tc.arguments, null, 2), null, true);
      wl.open = false; syncWorklogSummary(wl);
    }
    if (m.content) addBubble("assistant", m.content);
  }
}
function refreshReeditBtn() {
  // 「重新编辑」只挂在最新用户气泡上；重渲染后先清掉旧的再挂到最新的
  document.querySelectorAll(".reedit-btn").forEach(b => b.remove());
  if (lastUserMid) {
    const ar = document.querySelector(`.msg-user-actions[data-mid="${lastUserMid}"]`);
    if (ar) ar.appendChild(makeReeditBtn());
  }
}

// ---- cron 轮询：后台定时任务完成后，自动刷新当前会话 ----------------------
// 定时任务执行后会把结果 append 到绑定的 session；这里轮询该 session 绑定的
// 任务的 last_run_at，变化且确实有新消息时才静默重渲染，无需手动刷新页面。
let _cronPollTimer = null;
let _cronLastRun = {};          // {jobId: last_run_at} —— 仅记录，首次见到不触发

function startCronPoller(interval = 8000) {
  if (_cronPollTimer) return;
  _cronPollTimer = setInterval(cronPoll, interval);
}
function stopCronPoller() {
  if (_cronPollTimer) { clearInterval(_cronPollTimer); _cronPollTimer = null; }
}

async function cronPoll() {
  if (streaming || editing || !currentSid) return;
  let jobs = [];
  try {
    const data = await apiJson("/api/cron?include_disabled=true");
    jobs = (data.jobs || []).filter(j => j.session_id === currentSid);
  } catch (e) { return; }
  if (!jobs.length) return;

  // 检测绑定的任务是否有新的 last_run_at
  let changed = false;
  for (const j of jobs) {
    const key = j.last_run_at || "";
    if (_cronLastRun[j.id] !== undefined && _cronLastRun[j.id] !== key) changed = true;
    _cronLastRun[j.id] = key;
  }
  if (!changed) return;

  // 任务刚跑完：仅当 session 真的多了消息才重渲染（避免空响应/重复刷新）
  try {
    const detail = await apiJson("/api/sessions/" + currentSid);
    if (detail.messages.length === lastRenderedMsgCount) return;
    const msgs = $("msgs");
    const nearBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120;
    renderMessageList(detail);
    if (nearBottom) msgs.scrollTop = msgs.scrollHeight;
    await loadSessions();
  } catch (e) { /* ignore */ }
}

// ---- markdown 渲染 + LaTeX 数学见 markdown.js（escapeHtml/mdToHtml/renderMathInElement）----

function makeRestoreBtn(mid) {
  const b = document.createElement("button");
  b.className = "ghost"; b.textContent = "↩ 恢复";
  b.onclick = () => restoreFrom(mid);
  return b;
}
function makeReeditBtn() {
  const b = document.createElement("button");
  b.className = "ghost reedit-btn"; b.textContent = "✎ 重新编辑";
  b.onclick = startReedit;
  return b;
}
function addBubble(cls, text, mid) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "assistant") { d.dataset.raw = text; d.innerHTML = mdToHtml(text); renderMathInElement(d); }
  else if (cls === "user") renderUserContent(d, text);
  else d.textContent = text;
  $("msgs").appendChild(d);
  // 用户气泡下方挂一行操作按钮（恢复；最新用户气泡还会追加「重新编辑」）
  if (cls === "user" && mid != null) {
    d.dataset.mid = mid;
    const actions = document.createElement("div");
    actions.className = "msg-user-actions";
    actions.dataset.mid = mid;
    actions.appendChild(makeRestoreBtn(mid));
    $("msgs").appendChild(actions);
  }
  return d;
}
// 用户气泡：把 [附加文件: path] 引用行渲染成文件小图标 + 文件名，正文照常显示
function renderUserContent(d, text) {
  const atts = [], rest = [];
  for (const ln of text.split("\n")) {
    const m = ln.match(/^\[附加文件: (.+)\]$/);
    if (m) atts.push(m[1]); else rest.push(ln);
  }
  for (const path of atts) {
    const chip = document.createElement("div");
    chip.className = "filechip";
    chip.innerHTML = `<span class="fi">📄</span><span class="fn"></span>`;
    chip.querySelector(".fn").textContent = path.split("/").pop();
    d.appendChild(chip);
  }
  const body = rest.join("\n").replace(/^\n+/, "");
  if (body.trim()) {
    const p = document.createElement("div");
    p.className = "utext"; p.textContent = body;
    d.appendChild(p);
  }
}
// ---- worklog: 整轮活动折叠组（思考 + 工具合并为一行摘要，可展开看明细）-------
function ensureWorklog() {
  const d = document.createElement("details");
  d.className = "worklog"; d.open = true; d.dataset.live = "1";   // 流式时展开
  const s = document.createElement("summary"); s.className = "wl-head";
  s.innerHTML = `<span class="wl-caret">▸</span><span class="wl-sum"></span>`;
  const body = document.createElement("div"); body.className = "wl-body";
  d.append(s, body); $("msgs").appendChild(d); return d;
}
function worklogThinkingCard(wl) {
  let card = wl.querySelector(".thinking-card");
  if (!card) {
    card = document.createElement("div"); card.className = "thinking-card";
    card.innerHTML = `<div class="tc-label">💡 思考</div><div class="think-body"></div>`;
    card.querySelector(".think-body").dataset.raw = "";
    wl.querySelector(".wl-body").prepend(card);     // 思考置于工具之前
  }
  return card;
}
function appendToolRow(wl, name, args, id, done) {
  const d = document.createElement("details");
  d.className = "tool-card-row";
  d.dataset.toolKind = toolKind(name);
  d.dataset.toolDone = done ? "true" : "false";
  if (id != null) d.dataset.id = id;
  const first = String(args || "").split("\n")[0].slice(0, 80);
  const s = document.createElement("summary");
  s.textContent = "🔧 " + name + (first ? " · " + first : "");
  const pre = document.createElement("pre"); pre.textContent = args || "";
  d.append(s, pre); wl.querySelector(".wl-body").appendChild(d); return d;
}
function setToolResult(row, preview) {
  if (row) row.querySelector("pre").textContent += "\n→ " + preview;
}
function setToolDone(row, isError) {
  if (!row) return;
  row.dataset.toolDone = "true";
  if (isError) { row.dataset.toolError = "true"; row.classList.add("err"); }
}
function syncWorklogSummary(wl) {
  if (!wl) return;
  const hasThinking = !!wl.querySelector(".thinking-card");
  const tools = [...wl.querySelectorAll(".tool-card-row")].map(r => ({
    kind: r.dataset.toolKind,
    done: r.dataset.toolDone !== "false",
    error: r.dataset.toolError === "true",
  }));
  const live = wl.dataset.live === "1";
  wl.querySelector(".wl-sum").textContent = worklogSummary({hasThinking, live, tools});
}
function closeWorklog(wl) {
  if (!wl) return;
  delete wl.dataset.live; wl.open = false; syncWorklogSummary(wl);
}

// ---- chat streaming ---------------------------------------------------------
async function sendMsg(consumeQueued = false) {
  // 排队消息消费由调用方显式指定；队列非空时仍允许输入框继续追加新消息。
  let content;
  if (consumeQueued) {
    if (!queuedMessages.length) return;
    content = queuedMessages[0].content;
    // 如果队列只剩这最后一条，消费后 SSE 走完 finally 时会自动移除
  } else {
    const text = $("input").value.trim();
    if ((!text && !attached.length) || !currentSid) return;
    const refs = attached.map(a => `[附加文件: ${a.path}]`).join("\n");
    content = refs ? (refs + (text ? "\n\n" + text : "")) : text;
  }
  attached = []; renderChips();

  // 检查是否为斜杠命令
  const isRetryCmd = /^\/retry(?:\s|$)/.test(content);
  const isSlashCmd = content.startsWith("/") && !isRetryCmd;

  // 重新编辑：发送时才删除原用户消息及其回答，再以编辑后文本作为新轮发送
  if (editing) {
    $("input").value = ""; streaming = true;
    document.body.classList.add("streaming");
    $("send").classList.add("hidden"); $("stop").classList.remove("hidden");
    try {
      await api(`/api/sessions/${currentSid}/truncate`, {method: "POST", body: {message_id: editing.mid}});
    } catch (e) {
      document.body.classList.remove("streaming");
      streaming = false;
      $("send").classList.remove("hidden"); $("stop").classList.add("hidden");
      alert("重新编辑失败: " + e.message);
      return;
    }
    editing = null;
    await openSession(currentSid);
    document.body.classList.add("streaming");
  }

  // ── 斜杠命令：不走 SSE，直接发 API 拿 JSON ──────────
  if (isSlashCmd) {
    // 重新编辑场景已在上方清空输入框；此处兜底清空，避免发送后残留
    if (!editing) $("input").value = "";
    try {
      const resp = await api(`/api/sessions/${currentSid}/chat`, {method: "POST", body: {content}});
      const result = await expectJson(resp);
      if (result.handled) {
        await openSession(currentSid);
        if (result.action === "reload") {
          await loadSessions();
        }
      } else {
        addBubble("user", content);
        addBubble("assistant", result.content || "");
      }
    } catch (e) {
      addBubble("err", e.message);
    }
    return;
  }

  // ── 如果正在 streaming，尝试排队: 不显示气泡，仅入队 ──────
  if (streaming) {
    // 排队消息本身不再排队（已在队列中），跳过
    if (consumeQueued) return;
    try {
      const resp = await api(`/api/sessions/${currentSid}/chat`, {method: "POST", body: {content}});
      const result = await expectJson(resp);
      if (result.queued) {
        $("input").value = "";
        queuedMessages.push({ content });
        renderQueueStatus();
      } else {
        // 可能刚好上一轮结束了，退化为正常发送
        streaming = false;
        document.body.classList.remove("streaming");
        $("send").classList.remove("hidden"); $("stop").classList.add("hidden");
        await sendMsg();
      }
    } catch (e) {
      addBubble("err", e.message);
    }
    return;
  }

  $("input").value = ""; streaming = true;
  document.body.classList.add("streaming");
  $("send").classList.add("hidden"); $("stop").classList.remove("hidden");

  // 排队消息消费：先不显示用户气泡，等到模型实际开始回复（text_delta/reasoning_delta）时再显示
  // 非排队消息（普通消息 / 重新编辑）则立即显示；排队消费延迟到模型真正开始。
  let userBubbleShown = !consumeQueued || isRetryCmd;
  if (userBubbleShown) { addBubble("user", content); }
  let bubble = null, wl = null, errored = false;
  const msgs = $("msgs");
  try {
    const resp = await api(`/api/sessions/${currentSid}/chat`, {method: "POST", body: {content}});

    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "reasoning_delta") {
          if (bubble) continue;                  // answer started: lock out late reasoning
          // 模型开始思考时，才显示排队的用户消息（如果有）
          if (!userBubbleShown) { userBubbleShown = true; addBubble("user", content); }
          if (!wl) wl = ensureWorklog();
          const body = worklogThinkingCard(wl).querySelector(".think-body");
          body.dataset.raw += ev.text;
          body.innerHTML = mdToHtml(body.dataset.raw);
          renderMathInElement(body);
          syncWorklogSummary(wl);
        } else if (ev.type === "text_delta") {
          // 模型开始输出正文时，才显示排队的用户消息（如果没有思考阶段）
          if (!userBubbleShown) { userBubbleShown = true; addBubble("user", content); }
          if (!bubble) { if (wl) { closeWorklog(wl); wl = null; } bubble = addBubble("assistant", ""); }
          bubble.dataset.raw += ev.text;
          bubble.innerHTML = mdToHtml(bubble.dataset.raw);
          renderMathInElement(bubble);
        } else if (ev.type === "tool_call") {
          // 模型调用工具前，确保用户消息已显示
          if (!userBubbleShown) { userBubbleShown = true; addBubble("user", content); }
          bubble = null;                          // 正文后再来工具 -> 新开活动组
          if (!wl) wl = ensureWorklog();
          appendToolRow(wl, ev.name, JSON.stringify(ev.arguments, null, 2), ev.id, false);
          syncWorklogSummary(wl);
        } else if (ev.type === "tool_result") {
          const rows = msgs.querySelectorAll("details.tool-card-row");
          const row = [...rows].find(r => r.dataset.id === ev.id) || rows[rows.length - 1];
          setToolResult(row, ev.preview); setToolDone(row, false);
          syncWorklogSummary(row ? row.closest(".worklog") : wl);
        } else if (ev.type === "error") {
          if (ev.message === "stopped by user") {  // 强行停止：不视为错误，finally 重渲染为干净状态
            if (wl) { closeWorklog(wl); wl = null; }
            bubble = null;
          } else {
            if (wl) { closeWorklog(wl); wl = null; }
            addBubble("err", ev.message); bubble = null; errored = true;
          }
        } else if (ev.type === "turn_usage") {
          if (wl) { closeWorklog(wl); wl = null; }   // 本轮结束，折叠活动组
          const meta = document.createElement("div");
          meta.className = "turnmeta";
          meta.textContent = `本轮 ↑${ev.input_tokens} ↓${ev.output_tokens}` +
            (ev.cache_hit != null ? ` · 缓存 ${ev.cache_hit}%` : "");
          msgs.appendChild(meta);
          bubble = null;                              // 下一轮重新计
        } else if (ev.type === "done") {
          const u = ev.usage || {};
          $("ub-tok").textContent = `↑${u.input_tokens||0} ↓${u.output_tokens||0}`;
          $("ub-ctx").textContent = `ctx ${ev.context_length||0}/${ev.context_limit||0}`;
          $("ub-cache").textContent = ev.cache_hit != null ? `cache ${ev.cache_hit}%` : "cache —";
        } else if (ev.type === "queued_next") {
          // 排队消息已被后端消费。前端弹出第一条，并继续消费该 SSE 流
          content = ev.content ?? queuedMessages[0]?.content ?? content;
          queuedMessages.shift();
          renderQueueStatus();
          // 当前 SSE 流还会继续，下一轮内容会在同一个流中推送过来
          // 下一轮的用户气泡在收到 reasoning_delta/text_delta 时显示
          userBubbleShown = false;  // 新的一轮，用户气泡需要重新延迟显示
        }
        msgs.scrollTop = msgs.scrollHeight;
      }
    }
  } catch (e) {
    addBubble("err", e.message); errored = true;
  } finally {
    closeWorklog(wl);
    streaming = false;
    document.body.classList.remove("streaming");
    $("send").classList.remove("hidden"); $("stop").classList.add("hidden");
    if (errored) loadSessions();
    else if (queuedMessages.length) {
      // 还有排队消息，继续发送下一轮
      sendMsg(true);
    }
    else {
      await openSession(currentSid);
    }
  }
}
// ---- 排队消息状态显示 ------------------------------------------------
function renderQueueStatus() {
  const box = $("queue-status");
  if (!queuedMessages.length) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }
  box.classList.remove("hidden");
  box.innerHTML = `<span>📋 排队消息（${queuedMessages.length} 条）:</span>`;
  queuedMessages.forEach((q, i) => {
    const tag = document.createElement("span");
    tag.className = "chip";
    tag.style.cursor = "default";
    tag.innerHTML = `<b>#${i + 1}</b> <span></span>`;
    // 截取前 40 个字符
    const preview = q.content.length > 40 ? q.content.slice(0, 40) + "…" : q.content;
    tag.querySelector("span").textContent = preview;
    box.appendChild(tag);
  });
}

// ---- 斜杠命令命令面板（Command Palette）-----------------------------------
// 参考 hermes-agent 的 SlashCommandCompleter 实现
let _cmdList = [];           // 命令列表缓存
let _cmdFiltered = [];       // 当前过滤结果
let _cmdSel = -1;            // 当前选中索引
let _cmdCache = null;        // 命令列表 promise 缓存
// 二级建议（subcommand / suggestion）状态
let _suggestions = [];       // 当前建议列表
let _suggestionCmd = null;   // 哪个命令的建议
let _suggestionLevel = 0;    // 0=none, 1=command palette, 2=suggestion palette
let _suggestionSource = [];  // 未过滤的二级建议

async function _ensureCommands() {
  if (_cmdCache) return _cmdCache;
  _cmdCache = apiJson("/api/commands").then(cmds => { _cmdList = cmds; return cmds; }).catch(() => { _cmdList = []; return []; });
  return _cmdCache;
}

function showCmdPalette(prefix) {
  const p = $("cmd-palette"), items = $("cmd-palette-items");
  // 命令列表尚未加载 → 静默返回（input 事件会重试）
  if (!_cmdList.length) { p.style.display = "none"; return; }
  const lower = prefix.toLowerCase();
  _cmdFiltered = _cmdList.filter(c => c.name.startsWith(lower));
  if (!_cmdFiltered.length) { p.style.display = "none"; return; }
  _cmdSel = 0;
  items.innerHTML = _cmdFiltered.map((c, i) =>
    `<div class="citem${i === 0 ? " sel" : ""}" data-idx="${i}">` +
      `<span class="cn">/${c.name}</span>` +
      `<span class="cd">${c.description}</span>` +
      `<span class="ch">${c.category}</span>` +
    `</div>`
  ).join("");
  // 点击选择
  items.querySelectorAll(".citem").forEach(el => {
    el.onclick = () => _acceptCmd(+el.dataset.idx);
    el.onmouseenter = () => { _cmdSel = +el.dataset.idx; items.querySelectorAll(".citem").forEach(e => e.classList.toggle("sel", +e.dataset.idx === _cmdSel)); };
  });
  p.style.display = "block";
}

function hideCmdPalette() {
  $("cmd-palette").style.display = "none";
  _cmdFiltered = [];
  _suggestions = [];
  _suggestionSource = [];
  _suggestionCmd = null;
  _suggestionLevel = 0;
  _cmdSel = -1;
}

function cmdPaletteVisible() {
  return $("cmd-palette").style.display === "block";
}

function _acceptCmd(idx) {
  if (_suggestionLevel === 2) {
    _acceptSuggestion(idx);
    return;
  }
  if (idx < 0 || idx >= _cmdFiltered.length) return;
  const cmd = _cmdFiltered[idx];
  // 替换输入框内容为 /cmd_name + space
  const val = $("input").value;
  const cursor = $("input").selectionStart || val.length;
  const before = val.slice(0, cursor);
  const after = val.slice(cursor);
  // 把当前 /xxx 替换为 /cmd_name
  const newBefore = before.replace(/^\/\w*$/, "/" + cmd.name + " ");
  $("input").value = newBefore + after;
  $("input").focus();
  hideCmdPalette();
  // 如果该命令有建议，触发 input 事件显示二级建议
  $("input").dispatchEvent(new Event("input"));
}

function _acceptSuggestion(idx) {
  if (idx < 0 || idx >= _suggestions.length) return;
  const sug = _suggestions[idx];
  const val = $("input").value;
  const cursor = $("input").selectionStart || val.length;
  const before = val.slice(0, cursor);
  const after = val.slice(cursor);
  // 把二级建议插入为第一个参数："/cmd " 或 "/cmd par" -> "/cmd label "
  const newBefore = before.replace(/^(\/\w+\s+)\S*$/, "$1" + sug.label + " ");
  $("input").value = newBefore + after;
  $("input").focus();
  hideCmdPalette();
}

async function fetchSuggestions(cmdName) {
  try {
    const resp = await api(`/api/commands/suggestions?cmd=${encodeURIComponent(cmdName)}&session_id=${currentSid || ''}`);
    const data = await resp.json();
    return data.suggestions || [];
  } catch (e) {
    return [];
  }
}

function _filterSuggestions(suggestions, query) {
  const lower = (query || "").toLowerCase();
  if (!lower) return suggestions;
  return suggestions.filter(s => (s.label || "").toLowerCase().startsWith(lower));
}

function showSuggestions(cmdName, suggestions, query = "") {
  const p = $("cmd-palette"), items = $("cmd-palette-items");
  _suggestionSource = suggestions;
  const visible = _filterSuggestions(suggestions, query);
  if (!visible.length) { p.style.display = "none"; return; }

  _suggestions = visible;
  _suggestionCmd = cmdName;
  _suggestionLevel = 2;
  _cmdSel = 0;

  items.innerHTML = visible.map((s, i) =>
    `<div class="citem${i === 0 ? " sel" : ""}" data-idx="${i}">` +
      `<span class="cn">${s.label}</span>` +
      `<span class="cd">${s.description}</span>` +
      (s.args_hint ? `<span class="ch">${s.args_hint}</span>` : '') +
    `</div>`
  ).join("");

  items.querySelectorAll(".citem").forEach(el => {
    el.onclick = () => _acceptSuggestion(+el.dataset.idx);
    el.onmouseenter = () => { _cmdSel = +el.dataset.idx; _highlightSel(); };
  });
  p.style.display = "block";
}

function _selectNext() {
  const len = _suggestionLevel === 2 ? _suggestions.length : _cmdFiltered.length;
  if (!len) return;
  _cmdSel = Math.min(_cmdSel + 1, len - 1);
  _highlightSel();
}

function _selectPrev() {
  const len = _suggestionLevel === 2 ? _suggestions.length : _cmdFiltered.length;
  if (!len) return;
  _cmdSel = Math.max(_cmdSel - 1, 0);
  _highlightSel();
}

function _highlightSel() {
  const items = $("cmd-palette-items");
  items.querySelectorAll(".citem").forEach(el => el.classList.toggle("sel", +el.dataset.idx === _cmdSel));
  const selEl = items.querySelector(`.citem[data-idx="${_cmdSel}"]`);
  if (selEl) selEl.scrollIntoView({ block: "nearest" });
}

// ---- 输入事件：命令检测 + 命令面板 + 二级建议 -------------------------------------------
// 注意：下面有一段完全替换 textarea 的代码也会绑 input 事件，两处都需要更新

// 第一个 input 监听器（页面初始 textarea）
$("input").addEventListener("input", onInputChange);

// 新增：共享的 input 处理函数
function onInputChange() {
  const val = $("input").value;
  const cursor = $("input").selectionStart || val.length;
  const beforeCursor = val.slice(0, cursor);

  // Pattern 1: "/cmdname " or "/cmdname prefix" → show/filter second-level suggestions.
  const cmdArgMatch = beforeCursor.match(/^\/(\w+)\s+(\S*)$/);
  if (cmdArgMatch && !streaming) {
    const cmdName = cmdArgMatch[1];
    const query = cmdArgMatch[2] || "";
    _ensureCommands().then(() => {
      // 再次检查输入状态
      const v = $("input").value;
      const cur = $("input").selectionStart || v.length;
      const bc = v.slice(0, cur);
      const csm = bc.match(/^\/(\w+)\s+(\S*)$/);
      if (!csm || csm[1] !== cmdName) { hideCmdPalette(); return; }
      const latestQuery = csm[2] || "";
      const cmd = _cmdList.find(c => c.name === cmdName);
      if (cmd && cmd.has_suggestions) {
        if (cmd.suggestions) {
          // Static suggestions (already loaded from command list)
          showSuggestions(cmdName, cmd.suggestions, latestQuery);
        } else {
          // Dynamic suggestions → fetch from API
          fetchSuggestions(cmdName).then(sugs => {
            // 再次确认输入状态没变
            const v2 = $("input").value;
            const cur2 = $("input").selectionStart || v2.length;
            const csm2 = v2.slice(0, cur2).match(/^\/(\w+)\s+(\S*)$/);
            if (csm2 && csm2[1] === cmdName) {
              showSuggestions(cmdName, sugs, csm2[2] || "");
            }
          });
        }
      } else {
        hideCmdPalette();
      }
    });
    return;
  }

  // Pattern 2: "/abc" (no space, partial match) → show command palette
  const m = beforeCursor.match(/^\/(\w*)$/);
  if (m && !streaming) {
    _ensureCommands().then(() => {
      const v = $("input").value;
      const cur = $("input").selectionStart || v.length;
      const bc = v.slice(0, cur);
      const mm = bc.match(/^\/(\w*)$/);
      if (mm) showCmdPalette(mm[1]); else hideCmdPalette();
    });
  } else {
    hideCmdPalette();
  }
}

// 全局点击关闭命令面板
document.addEventListener("mousedown", e => {
  if (cmdPaletteVisible() && !e.target.closest("#cmd-palette") && e.target !== $("input")) {
    // 延时关闭，让 click 事件先到达 textarea
    setTimeout(hideCmdPalette, 100);
  }
});

// 替换原来的 keydown 监听
// 直接全量替换：清掉所有 keydown 监听，只保留我们的
// 1) 移除旧的 _keydownHandler
const oldHandler = $("input")._keydownHandler;
if (oldHandler) $("input").removeEventListener("keydown", oldHandler);
// 2) 完全替换 textarea 来移除匿名 keydown
const oldInput = $("input");
const newInput = document.createElement("textarea");
newInput.id = "input";
newInput.placeholder = oldInput.placeholder;
newInput.value = "";
// 把旧的 data-* 属性也带过去
oldInput.parentNode.replaceChild(newInput, oldInput);
// 3) 新 textarea 上绑 input 事件（命令浮层检测 + 二级建议）
newInput.addEventListener("input", onInputChange);
// 4) 新 textarea 上绑 keydown
$("input")._keydownHandler = e => {
  if (cmdPaletteVisible()) {
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
      e.preventDefault();
      _acceptCmd(_cmdSel);
      return;
    }
    if (e.key === "ArrowDown") { e.preventDefault(); _selectNext(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); _selectPrev(); return; }
    if (e.key === "Escape") { e.preventDefault(); hideCmdPalette(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
};
$("input").addEventListener("keydown", $("input")._keydownHandler);

// ---- file tree (REQ2.1) -----------------------------------------------------
function toggleFiles() {
  const ft = $("filetree");
  ft.classList.toggle("hidden");
  if (!ft.classList.contains("hidden")) loadTree();
}
async function loadTree() {
  const body = $("treebody"); body.innerHTML = "";
  await renderInto(body, "");
}
async function renderInto(container, path) {
  let data;
  try { data = await apiJson("/api/files" + (path ? "?path=" + encodeURIComponent(path) : "")); }
  catch (e) { container.textContent = e.message; return; }
  if (!data.entries.length) { container.innerHTML = `<div class="muted">(empty)</div>`; return; }
  for (const e of data.entries) {
    const node = document.createElement("div");
    node.className = "tnode";
    node.textContent = (e.is_dir ? "▸ " : "   ") + e.name;
    if (!e.is_dir) { const s = document.createElement("span"); s.className = "sz"; s.textContent = e.size + "B"; node.appendChild(s); }
    container.appendChild(node);
    if (e.is_dir) {
      const kids = document.createElement("div");
      kids.className = "tchildren hidden"; container.appendChild(kids);
      node.onclick = async () => {
        kids.classList.toggle("hidden");
        const open = !kids.classList.contains("hidden");
        node.firstChild.textContent = (open ? "▾ " : "▸ ") + e.name;
        if (!kids.dataset.loaded) { kids.dataset.loaded = "1"; await renderInto(kids, e.path); }
      };
    } else {
      node.onclick = () => previewFile(e.path);
    }
  }
}
async function previewFile(path) {
  let data;
  try { data = await apiJson("/api/files/read?path=" + encodeURIComponent(path)); }
  catch (e) { alert(e.message); return; }
  if (data.content !== undefined) {
    if (confirm(`${data.name} (${data.size}B)\n\n` + data.content.slice(0, 2000) +
                (data.content.length > 2000 ? "\n..." : "") + "\n\n点「确定」下载该文件")) {
      downloadBlob(new Blob([data.content]), data.name);
    }
  } else {
    const a = document.createElement("a");
    a.href = data.data_url; a.download = data.name; a.click();
  }
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ---- upload & attach to context (REQ2.2) ------------------------------------
let attached = [];           // [{name, path}]
let currentAgent = null;     // 当前会话的 agent（用于 read_file 提示）

function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
async function onFileChosen(ev) {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const dataUrl = await fileToDataUrl(file);
    const r = await apiJson("/api/files/upload", {method: "POST",
      body: {path: file.name, data_url: dataUrl}});
    attached.push({name: r.entry.name, path: r.entry.path});
    renderChips();
    if (!$("filetree").classList.contains("hidden")) loadTree();
  } catch (e) { alert("上传失败: " + e.message); }
}
function renderChips() {
  const box = $("chips"); box.innerHTML = "";
  attached.forEach((a, i) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.innerHTML = `📎 <b></b> <span class="x">✕</span>`;
    c.querySelector("b").textContent = a.path;
    c.querySelector(".x").onclick = () => { attached.splice(i, 1); renderChips(); };
    box.appendChild(c);
  });
}
function updateAttachHint() {
  const btn = $("attach");
  const ok = currentAgent && (currentAgent.tools || []).includes("read_file");
  btn.title = ok ? "上传文件并加入对话上下文"
                 : "当前 agent 未启用 read_file，附件可能无法被读取";
  btn.style.opacity = ok ? "1" : ".6";
}

// ---- tabs -------------------------------------------------------------------
function showTab(name) {
  for (const n of ["chat", "agents", "groups", "admin"]) {
    $(n).classList.toggle("hidden", n !== name);
    $("tab-" + n).classList.toggle("on", n === name);
  }
  if (name === "admin") renderAdmin();
  if (name === "agents") renderAgents();
  if (name === "groups") renderGroups();
}

// ---- admin ------------------------------------------------------------------
async function renderAdmin() {
  const box = $("admin");
  const [users, skills, groups] = await Promise.all([
    apiJson("/api/users"), apiJson("/api/skills"), apiJson("/api/groups")]);
  const adminGroup = groups.find(g => g.is_admin_group) || {};
  const adminGid = adminGroup.id;
  const adminMembers = adminGid ? await apiJson(`/api/groups/${adminGid}/members`) : [];
  const adminIds = new Set(adminMembers.map(m => m.user_id));
  const rootId = adminMembers.find(m => m.is_owner)?.user_id;
  box.innerHTML = "";

  // users card -- admin status is admin-group membership (REQ1.8)
  const uc = card(box, "Users");
  const ut = table(uc, ["ID", "Username", "Admin", ""]);
  for (const u of users) {
    const isAdmin = adminIds.has(u.id), isRoot = u.id === rootId;
    const tr = row(ut, [u.id, u.username + (isRoot ? " ★" : ""), isAdmin ? "yes" : "—"]);
    const td = tr.insertCell();
    td.innerHTML = `<div class="row-actions"></div>`;
    btn(td.firstChild, "reset pw", "ghost", async () => {
      const pw = prompt(`New password for ${u.username}:`); if (!pw) return;
      await apiJson(`/api/users/${u.id}`, {method: "PATCH", body: {password: pw}}).catch(alertErr);
    });
    if (!isRoot && adminGid) {
      btn(td.firstChild, isAdmin ? "revoke admin" : "make admin", "ghost", async () => {
        const m = isAdmin ? "DELETE" : "POST";
        await apiJson(`/api/groups/${adminGid}/members${isAdmin ? "/" + u.id : ""}`,
          {method: m, body: isAdmin ? undefined : {user_id: u.id}}).catch(alertErr);
        renderAdmin();
      });
      btn(td.firstChild, "delete", "danger", async () => {
        if (!confirm(`Delete user ${u.username} and all their data?`)) return;
        await apiJson(`/api/users/${u.id}`, {method: "DELETE"}).catch(alertErr);
        renderAdmin();
      });
    }
  }
  uc.insertAdjacentHTML("beforeend",
    `<div class="grid2"><div><label>Username</label><input id="nu-name"></div>
     <div><label>Password</label><input id="nu-pass"></div></div>
     <div style="margin-top:10px"><button id="nu-add">Add user</button></div>
     <div class="muted" style="margin-top:6px">★ = root admin (only the root admin can modify them). New users get their own group automatically.</div>`);
  $("nu-add").onclick = async () => {
    await apiJson("/api/users", {method: "POST",
      body: {username: $("nu-name").value.trim(), password: $("nu-pass").value}}).catch(alertErr);
    renderAdmin();
  };

  // all groups card
  const gc = card(box, "All groups");
  const gt = table(gc, ["ID", "Name", "Owner", ""]);
  for (const g of groups) {
    const ownerName = (users.find(u => u.id === g.owner_id) || {}).username || g.owner_id;
    const tr = row(gt, [g.id, g.name + (g.is_admin_group ? " (admin)" : ""), ownerName]);
    const td = tr.insertCell();
    td.innerHTML = `<div class="row-actions"></div>`;
    btn(td.firstChild, "open", "ghost", () => { showTab("groups"); setTimeout(() => focusGroup(g.id), 0); });
    if (!g.is_admin_group) btn(td.firstChild, "delete", "danger", async () => {
      if (!confirm(`Delete group ${g.name}? (fails for a user's personal group)`)) return;
      await apiJson(`/api/groups/${g.id}`, {method: "DELETE"}).catch(alertErr);
      renderAdmin();
    });
  }
  gc.insertAdjacentHTML("beforeend",
    `<div class="grid2"><div><label>New group name</label><input id="ng-name"></div></div>
     <div style="margin-top:10px"><button id="ng-add">Create group</button></div>`);
  $("ng-add").onclick = async () => {
    const name = $("ng-name").value.trim(); if (!name) return;
    await apiJson("/api/groups", {method: "POST", body: {name}}).catch(alertErr);
    renderAdmin();
  };

  // providers card (REQ3.1)
  const pc = card(box, "Providers (模型供应商 — admin)");
  const providers = await apiJson("/api/providers");
  const pt = table(pc, ["Name", "Mode", "Base URL", "Key", "Ctx", "Source", ""]);
  for (const p of providers) {
    const tr = row(pt, [p.name, p.api_mode, p.base_url || "—", p.api_key || "—",
                        p.context_limit, p.source]);
    const td = tr.insertCell(); td.innerHTML = `<div class="row-actions"></div>`;
    if (p.source === "db") {
      btn(td.firstChild, "edit", "ghost", () => providerForm(pc, p));
      btn(td.firstChild, "delete", "danger", async () => {
        if (!confirm(`Delete provider ${p.name}?`)) return;
        await apiJson("/api/providers/" + p.name, {method: "DELETE"}).catch(alertErr);
        renderAdmin();
      });
    }
  }
  const pnb = document.createElement("div"); pnb.style.marginTop = "10px"; pc.appendChild(pnb);
  btn(pnb, "+ New provider", "", () => providerForm(pc, null));

  // system settings card — 可调上传文件大小上限（admin）
  const scfg = card(box, "系统设置 (System settings — admin)");
  const s = await apiJson("/api/settings");
  const toMB = (b) => +(b / 1048576).toFixed(3);
  const minMB = toMB(s.min_bytes), maxMB = toMB(s.max_bytes), defMB = toMB(s.default_max_upload_bytes);
  scfg.insertAdjacentHTML("beforeend", `
    <label>上传/下载单文件大小上限 (MB)</label>
    <div style="display:flex;gap:8px;align-items:center;max-width:360px">
      <input id="cfg-upload-mb" type="number" step="0.001" min="${minMB}" max="${maxMB}"
             value="${toMB(s.max_upload_bytes)}" style="flex:1">
      <button id="cfg-upload-save">保存</button>
    </div>
    <div class="muted" style="margin-top:6px">允许范围：${minMB} – ${maxMB} MB（默认 ${defMB} MB）</div>`);
  $("cfg-upload-save").onclick = async () => {
    const mb = parseFloat($("cfg-upload-mb").value);
    if (!(mb > 0) || mb < minMB || mb > maxMB) {
      alert(`请输入 ${minMB} – ${maxMB} MB 之间的数值`); return;
    }
    try {
      await apiJson("/api/settings/max_upload_bytes",
        {method: "PUT", body: {max_upload_bytes: Math.round(mb * 1048576)}});
      alert("已保存");
      renderAdmin();
    } catch (e) { alertErr(e); }
  };

  // skills card
  const sc = card(box, "Skills (agent-created knowledge — review here)");
  if (!skills.length) sc.insertAdjacentHTML("beforeend", `<div class="muted">No skills yet. Agents create them as they learn.</div>`);
  const st = table(sc, ["Name", "Description", "Tags", ""]);
  for (const s of skills) {
    const tr = row(st, [s.name, s.description, (s.tags || []).join(", ")]);
    const td = tr.insertCell();
    td.innerHTML = `<div class="row-actions"></div>`;
    btn(td.firstChild, "view", "ghost", async () => {
      const d = await apiJson("/api/skills/" + s.name);
      alert(d.content.slice(0, 3000));
    });
    btn(td.firstChild, "delete", "danger", async () => {
      if (!confirm(`Delete skill ${s.name}?`)) return;
      await apiJson("/api/skills/" + s.name, {method: "DELETE"}).catch(alertErr);
      renderAdmin();
    });
  }
}

function providerForm(parent, existing) {
  const old = parent.querySelector(".provider-form"); if (old) old.remove();
  const f = document.createElement("div"); f.className = "provider-form";
  f.style.cssText = "margin-top:12px;border-top:1px solid var(--border);padding-top:8px";
  f.innerHTML = `
    <div class="grid2">
      <div><label>Name</label><input id="pf-name"></div>
      <div><label>API mode</label><select id="pf-mode">
        <option value="openai">openai</option><option value="anthropic">anthropic</option></select></div>
      <div><label>Base URL</label><input id="pf-url" placeholder="https://api.example.com/v1"></div>
      <div><label>Context limit</label><input id="pf-ctx" type="number" value="100000"></div>
      <div><label>API key${existing ? " (留空=不变)" : ""}</label><input id="pf-key" type="password"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="pf-save"></button><button class="ghost" id="pf-cancel">Cancel</button></div>`;
  parent.appendChild(f);
  if (existing) {
    $("pf-name").value = existing.name; $("pf-name").disabled = true;
    $("pf-mode").value = existing.api_mode; $("pf-url").value = existing.base_url || "";
    $("pf-ctx").value = existing.context_limit;
  }
  $("pf-save").textContent = existing ? "Save" : "Create";
  $("pf-cancel").onclick = () => f.remove();
  $("pf-save").onclick = async () => {
    const body = {api_mode: $("pf-mode").value, base_url: $("pf-url").value.trim() || null,
                  context_limit: +$("pf-ctx").value, api_key: $("pf-key").value};
    try {
      if (existing) await apiJson("/api/providers/" + existing.name, {method: "PUT", body});
      else { body.name = $("pf-name").value.trim();
             await apiJson("/api/providers", {method: "POST", body}); }
      renderAdmin();
    } catch (e) { alert(e.message); }
  };
}

async function fillModels(provider, datalistId) {
  const dl = $(datalistId); if (!dl) return; dl.innerHTML = "";
  if (!provider) return;
  try {
    const {models} = await apiJson("/api/providers/" + provider + "/models");
    for (const m of models || []) { const o = document.createElement("option"); o.value = m; dl.appendChild(o); }
  } catch (e) { /* 静默回退到手填（非 admin 会 403） */ }
}

async function setupSessTools(detail) {
  // provider 选项：任意用户可拿 names
  let providers = [];
  try { providers = (await apiJson("/api/agents/meta/options")).providers || []; } catch (e) {}
  const curProvider = detail.override_provider || (currentAgent && currentAgent.provider) || "";
  const psel = $("st-provider");
  psel.innerHTML = "";
  for (const p of providers) { const o = document.createElement("option"); o.value = o.textContent = p; psel.appendChild(o); }
  if (curProvider && !providers.includes(curProvider)) {
    const o = document.createElement("option"); o.value = o.textContent = curProvider; psel.appendChild(o);
  }
  psel.value = curProvider;
  $("st-model").value = detail.override_model || (currentAgent && currentAgent.model) || "";
  $("st-think").value = detail.thinking_mode || "default";
  fillModels(psel.value, "st-models");
  psel.onchange = () => { fillModels(psel.value, "st-models"); saveOverrides(); };
  $("st-model").onchange = saveOverrides;
  $("st-think").onchange = saveOverrides;
}

async function saveOverrides() {
  if (!currentSid) return;
  await apiJson("/api/sessions/" + currentSid, {method: "PATCH", body: {
    override_provider: $("st-provider").value || null,
    override_model: $("st-model").value.trim() || null,
    thinking_mode: $("st-think").value}}).catch(()=>{});
}

  const old = parent.querySelector(".agent-form"); if (old) old.remove();
  const f = document.createElement("div");
  f.className = "agent-form";
  f.style.cssText = "margin-top:12px;border-top:1px solid var(--border);padding-top:8px";
  f.innerHTML = `
    <div class="grid2">
      <div><label>Name</label><input id="af-name"></div>
      <div><label>Group</label><select id="af-group"></select></div>
      <div><label>Description</label><input id="af-desc"></div>
      <div><label>Provider</label><select id="af-provider"></select></div>
      <div><label>Model</label><input id="af-model" list="af-models" placeholder="e.g. gpt-4o, claude-sonnet-4-6"><datalist id="af-models"></datalist></div>
    </div>
    <label>System prompt</label><textarea id="af-prompt" rows="4"></textarea>
    <label>Tools</label><div id="af-tools"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button id="af-save"></button><button class="ghost" id="af-cancel">Cancel</button>
    </div>`;

    $("af-group").appendChild(o);
  }
  if (existing) { $("af-group").value = existing.group_id; $("af-group").disabled = true; }
  for (const p of options.providers) {
    const o = document.createElement("option"); o.value = o.textContent = p;
    $("af-provider").appendChild(o);
  }
  for (const t of options.tools) {
    const id = "aft-" + t;
    const lbl = document.createElement("label");
    lbl.style.cssText = "display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;color:var(--text);font-size:13px";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.id = id; cb.value = t; cb.style.width = "auto";
    lbl.append(cb, document.createTextNode(t));
    $("af-tools").appendChild(lbl);
  }
  if (existing) {
    $("af-name").value = existing.name; $("af-desc").value = existing.description;
    $("af-provider").value = existing.provider; $("af-model").value = existing.model;
    $("af-prompt").value = existing.system_prompt;
    for (const t of existing.tools) { const cb = $("aft-" + t); if (cb) cb.checked = true; }

  fillModels($("af-provider").value, "af-models");
  $("af-save").textContent = existing ? "Save changes" : "Create agent";
  $("af-cancel").onclick = () => f.remove();
  $("af-save").onclick = async () => {
    const body = {
      name: $("af-name").value.trim(), description: $("af-desc").value.trim(),
      provider: $("af-provider").value, model: $("af-model").value.trim(),
      system_prompt: $("af-prompt").value,
      tools: [...f.querySelectorAll("#af-tools input:checked")].map(c => c.value),
    };
    if (!existing && $("af-group").value) body.group_id = +$("af-group").value;
    try {
      if (existing) await apiJson(`/api/agents/${existing.id}`, {method: "PUT", body});
      else await apiJson("/api/agents", {method: "POST", body});
      renderAgents();
    } catch (e) { alert(e.message); }
  };
}

// ---- agents tab -------------------------------------------------------------
async function renderAgents() {
  const box = $("agents");
  const [options, groups] = await Promise.all([
    apiJson("/api/agents/meta/options"), apiJson("/api/groups")]);
  agents = await apiJson("/api/agents");
  const manageable = groups.filter(g => g.role === "owner" || g.role === "manager" || g.role === "admin");
  const groupName = id => (groups.find(g => g.id === id) || {}).name || id;
  box.innerHTML = "";

  const ac = card(box, "Agents");
  const at = table(ac, ["Name", "Group", "Provider/Model", "Tools", ""]);
  for (const a of agents) {
    const tr = row(at, [a.name, groupName(a.group_id), `${a.provider} / ${a.model}`, ""]);
    tr.cells[3].innerHTML = a.tools.map(() => `<span class="tag"></span>`).join("");
    [...tr.cells[3].children].forEach((el, i) => el.textContent = a.tools[i]);
    const td = tr.insertCell();
    td.innerHTML = `<div class="row-actions"></div>`;
    const canManage = manageable.some(g => g.id === a.group_id);
    if (canManage) {
      btn(td.firstChild, "edit", "ghost", () => agentForm(ac, options, a, manageable));
      btn(td.firstChild, "delete", "danger", async () => {
        if (!confirm(`Delete agent ${a.name}?`)) return;
        await apiJson(`/api/agents/${a.id}`, {method: "DELETE"}).catch(alertErr);
        renderAgents();
      });
    }
  }
  const nb = document.createElement("div"); nb.style.marginTop = "10px"; ac.appendChild(nb);
  if (manageable.length) btn(nb, "+ New agent", "", () => agentForm(ac, options, null, manageable));
  else ac.insertAdjacentHTML("beforeend", `<div class="muted">You can create agents only in groups you own or manage.</div>`);
}

let _focusGroup = null;
function focusGroup(id) { _focusGroup = id; renderGroups(); }

async function renderGroups() {
  const box = $("groups");
  const [groups, invites] = await Promise.all([
    apiJson("/api/groups"), apiJson("/api/me/invitations")]);
  box.innerHTML = "";

  // invitations
  if (invites.length) {
    const ic = card(box, "Invitations");
    const it = table(ic, ["Group", ""]);
    for (const inv of invites) {
      const tr = row(it, [inv.group_name]);
      const td = tr.insertCell(); td.innerHTML = `<div class="row-actions"></div>`;
      btn(td.firstChild, "accept", "", async () => {
        await apiJson(`/api/joinreq/${inv.id}/accept`, {method: "POST"}).catch(alertErr);
        agents = await apiJson("/api/agents"); renderGroups();
      });
      btn(td.firstChild, "decline", "ghost", async () => {
        await apiJson(`/api/joinreq/${inv.id}`, {method: "DELETE"}).catch(alertErr); renderGroups();
      });
    }
  }

  // my groups
  for (const g of groups) {
    const c = card(box, "");
    c.querySelector("h3").innerHTML =
      `${escapeHtml(g.name)} <span class="pill ${g.role}">${g.role}</span>`;
    const canManage = g.role === "owner" || g.role === "admin";
    const detail = await apiJson(`/api/groups/${g.id}`);
    const mt = table(c, ["Member", "Manage agents/sessions", ""]);
    for (const m of detail.members) {
      const tr = row(mt, [m.username + (m.is_owner ? " (owner)" : ""), m.can_manage ? "yes" : "—"]);
      const td = tr.insertCell(); td.innerHTML = `<div class="row-actions"></div>`;
      if (canManage && !m.is_owner) {
        btn(td.firstChild, m.can_manage ? "revoke manage" : "grant manage", "ghost", async () => {
          await apiJson(`/api/groups/${g.id}/members/${m.user_id}`,
            {method: "PATCH", body: {can_manage: !m.can_manage}}).catch(alertErr);
          renderGroups();
        });
        btn(td.firstChild, "remove", "danger", async () => {
          await apiJson(`/api/groups/${g.id}/members/${m.user_id}`, {method: "DELETE"}).catch(alertErr);
          renderGroups();
        });
      }
    }
    if (canManage) {
      // pending requests
      const pending = await apiJson(`/api/groups/${g.id}/pending`);
      if (pending.length) {
        c.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-top:10px">Join requests</div>`);
        const pt = table(c, ["User", ""]);
        for (const p of pending) {
          const tr = row(pt, [p.username]);
          const td = tr.insertCell(); td.innerHTML = `<div class="row-actions"></div>`;
          btn(td.firstChild, "approve", "", async () => {
            await apiJson(`/api/joinreq/${p.id}/approve`, {method: "POST"}).catch(alertErr); renderGroups();
          });
          btn(td.firstChild, "reject", "ghost", async () => {
            await apiJson(`/api/joinreq/${p.id}`, {method: "DELETE"}).catch(alertErr); renderGroups();
          });
        }
      }
      // invite + rename
      const tools = document.createElement("div"); tools.style.marginTop = "10px";
      tools.innerHTML = `<div class="grid2">
        <div><label>Invite user id</label><input class="gi-user"></div>
        <div><label>Rename group</label><input class="gi-name" value="${escapeHtml(g.name)}"></div></div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="gi-invite">Invite</button>
        <button class="gi-rename ghost">Rename</button></div>`;
      c.appendChild(tools);
      tools.querySelector(".gi-invite").onclick = async () => {
        const v = +tools.querySelector(".gi-user").value; if (!v) return;
        await apiJson(`/api/groups/${g.id}/invite`, {method: "POST", body: {user_id: v}}).catch(alertErr);
        alert("invited"); renderGroups();
      };
      tools.querySelector(".gi-rename").onclick = async () => {
        const name = tools.querySelector(".gi-name").value.trim(); if (!name) return;
        await apiJson(`/api/groups/${g.id}`, {method: "PATCH", body: {name}}).catch(alertErr); renderGroups();
      };
    }
    if (_focusGroup === g.id) { c.scrollIntoView(); c.style.outline = "1px solid var(--accent)"; }
  }
  _focusGroup = null;

  // request to join another group
  const jc = card(box, "Join another group");
  jc.insertAdjacentHTML("beforeend",
    `<div class="muted">Ask the group's owner for its ID, then request to join.</div>
     <div class="grid2"><div><label>Group ID</label><input id="jg-id"></div></div>
     <div style="margin-top:8px"><button id="jg-go">Request to join</button></div>`);
  $("jg-go").onclick = async () => {
    const v = +$("jg-id").value; if (!v) return;
    await apiJson(`/api/groups/${v}/join`, {method: "POST"}).then(() => alert("request sent")).catch(alertErr);
  };
}

// small DOM helpers
function card(parent, title) {
  const c = document.createElement("div"); c.className = "card";
  const h = document.createElement("h3"); h.style.margin = "0 0 4px"; h.textContent = title;
  c.appendChild(h); parent.appendChild(c); return c;
}
function table(parent, headers) {
  const t = document.createElement("table");
  const tr = t.createTHead().insertRow();
  for (const h of headers) { const th = document.createElement("th"); th.textContent = h; tr.appendChild(th); }
  t.createTBody(); parent.appendChild(t); return t.tBodies[0];
}
function row(tbody, cells) {
  const tr = tbody.insertRow();
  for (const c of cells) tr.insertCell().textContent = c;
  return tr;
}
function btn(parent, label, cls, onclick) {
  const b = document.createElement("button");
  if (cls) b.className = cls;
  b.textContent = label; b.onclick = onclick;
  b.style.fontSize = "12px"; b.style.padding = "3px 8px";
  parent.appendChild(b); return b;
}
const alertErr = e => alert(e.message);

if (token) boot(); else $("li-user").focus();
</script>
</body>
</html>
