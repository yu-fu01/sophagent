services:
  sophagent:
    image: ${SOPHAGENT_IMAGE:-sophagent:local}
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${SOPHAGENT_PORT:-8000}:8000"
    volumes:
      - sophagent-data:/data
      # recommended way to configure model providers (see README); comment out
      # this line if you pass SOPHAGENT_PROVIDERS via environment instead
      - ./data/providers.yaml:/data/providers.yaml:ro
    environment:
      # see .env.example; all variables are optional except a provider config
      # 服务器时区：cron 定时任务按服务器本地时间计算（默认北京时间，可用 TZ 覆盖）
      - TZ=${TZ:-Asia/Shanghai}
      - SOPHAGENT_SECRET=${SOPHAGENT_SECRET:-}
      - SOPHAGENT_NO_LOGIN=${SOPHAGENT_NO_LOGIN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SOPHAGENT_PROVIDERS=${SOPHAGENT_PROVIDERS:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SOPHAGENT_STT_API_KEY=${SOPHAGENT_STT_API_KEY:-}
      - SOPHAGENT_STT_BASE_URL=${SOPHAGENT_STT_BASE_URL:-}
      - SOPHAGENT_STT_MODEL=${SOPHAGENT_STT_MODEL:-Fun-ASR}
      - SOPHAGENT_WEIXIN_ACCOUNT_ID=${SOPHAGENT_WEIXIN_ACCOUNT_ID:-}
      - SOPHAGENT_WEIXIN_TOKEN=${SOPHAGENT_WEIXIN_TOKEN:-}
      - SOPHAGENT_WEIXIN_BASE_URL=${SOPHAGENT_WEIXIN_BASE_URL:-}
      - SOPHAGENT_WEIXIN_ALLOWED_USER_IDS=${SOPHAGENT_WEIXIN_ALLOWED_USER_IDS:-}
      - SOPHAGENT_WEIXIN_DM_POLICY=${SOPHAGENT_WEIXIN_DM_POLICY:-}
      - SOPHAGENT_WEIXIN_CDN_BASE_URL=${SOPHAGENT_WEIXIN_CDN_BASE_URL:-}
      - SOPHAGENT_WEIXIN_SPLIT_MULTILINE=${SOPHAGENT_WEIXIN_SPLIT_MULTILINE:-}
      - SOPHAGENT_DINGTALK_CLIENT_ID=${SOPHAGENT_DINGTALK_CLIENT_ID:-}
      - SOPHAGENT_DINGTALK_CLIENT_SECRET=${SOPHAGENT_DINGTALK_CLIENT_SECRET:-}
      - SOPHAGENT_DINGTALK_CARD_TEMPLATE_ID=${SOPHAGENT_DINGTALK_CARD_TEMPLATE_ID:-}
      - SOPHAGENT_DINGTALK_ROBOT_CODE=${SOPHAGENT_DINGTALK_ROBOT_CODE:-}
      - SOPHAGENT_DINGTALK_ALLOWED_USER_IDS=${SOPHAGENT_DINGTALK_ALLOWED_USER_IDS:-}
      - SOPHAGENT_DINGTALK_DM_POLICY=${SOPHAGENT_DINGTALK_DM_POLICY:-}
      - SOPHAGENT_DINGTALK_REQUIRE_MENTION=${SOPHAGENT_DINGTALK_REQUIRE_MENTION:-}
      - SOPHAGENT_DINGTALK_ALLOWED_CHAT_IDS=${SOPHAGENT_DINGTALK_ALLOWED_CHAT_IDS:-}
      - SOPHAGENT_DINGTALK_FREE_RESPONSE_CHATS=${SOPHAGENT_DINGTALK_FREE_RESPONSE_CHATS:-}
      - SOPHAGENT_DINGTALK_MENTION_PATTERNS=${SOPHAGENT_DINGTALK_MENTION_PATTERNS:-}
    restart: unless-stopped
    mem_limit: 1g

volumes:
  sophagent-data:
