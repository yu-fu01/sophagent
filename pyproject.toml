[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sophclaw-agent"
version = "0.1.0"
description = "Lightweight multi-user, multi-agent service with self-evolving skills (hermes-inspired)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "aiosqlite>=0.19",
    "openai>=1.40,<3",
    "anthropic>=0.34,<1",
    "PyJWT>=2.8,<3",
    "bcrypt>=4.0,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sophclaw*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
