replicaCount: 1

data:
  # PVC for mounting /data (SQLite, skills, workspaces)
  pvcClaimName: "sophagent-data-pvc"

env:
  TZ: "Asia/Shanghai"
  SOPHAGENT_DATA_DIR: "/data"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "sophnet"
  SOPHAGENT_SECRET: ""
  SOPHAGENT_NO_LOGIN: ""
  SOPHAGENT_PROVIDERS: '{"providers":{"sophnet":{"api_mode":"openai","base_url":"https://www.sophnet.com/api/open-apis/v1","api_key":"VaDnyTW2SqHVxeVFBjN16KyQjbDlxsInWjDD1QFm9qe2nqEaBplrf9dGsER4od_v37-jJnDrmInhKlAAzJvlzQ","context_limit":128000}}}'
  TAVILY_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  # Weixin (personal WeChat via iLink Bot API) — optional
  SOPHAGENT_WEIXIN_ACCOUNT_ID: ""
  SOPHAGENT_WEIXIN_TOKEN: ""
  SOPHAGENT_WEIXIN_BASE_URL: ""
  SOPHAGENT_WEIXIN_ALLOWED_USER_IDS: ""
  SOPHAGENT_WEIXIN_DM_POLICY: "pairing"
  SOPHAGENT_WEIXIN_CDN_BASE_URL: ""
  SOPHAGENT_WEIXIN_SPLIT_MULTILINE: ""
  # DingTalk (Stream mode) — optional
  SOPHAGENT_DINGTALK_CLIENT_ID: ""
  SOPHAGENT_DINGTALK_CLIENT_SECRET: ""
  SOPHAGENT_DINGTALK_CARD_TEMPLATE_ID: ""
  SOPHAGENT_DINGTALK_ROBOT_CODE: ""
  SOPHAGENT_DINGTALK_DM_POLICY: "pairing"
  SOPHAGENT_DINGTALK_ALLOWED_USER_IDS: ""
  SOPHAGENT_DINGTALK_REQUIRE_MENTION: "true"
  SOPHAGENT_DINGTALK_ALLOWED_CHAT_IDS: ""
  SOPHAGENT_DINGTALK_FREE_RESPONSE_CHATS: ""
  SOPHAGENT_DINGTALK_MENTION_PATTERNS: ""
  SOPHAGENT_DINGTALK_WEBHOOK_URL: ""
  SOPHAGENT_DINGTALK_HOME_CHANNEL: ""
  SOPHAGENT_DINGTALK_REPLY_EMOTION: "true"

image:
  repository: docker.fuyucloud.top/sophagent
  tag: "latest"

# Leave empty when the registry does not require authentication.
imagePullSecretName: ""

service:
  port: 8000

ingress:
  enabled: true
  name: "sophagent-ingress"
  className: "nginx-private"
  host: "devsophagent-web.fastmodels.cn"
  annotations: {}
  tls:
    - hosts:
        - devsophagent-web.fastmodels.cn
      secretName: fastmodels-2024-tls

container:
  name: "sophagent"

resources:
  limits:
    cpu: "1000m"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
